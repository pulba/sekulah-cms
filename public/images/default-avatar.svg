<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" width="300" height="400" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="400" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid/Frame Accent -->
  <rect x="12" y="12" width="276" height="376" rx="8" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 4" />
  
  <!-- Stylized Neutral Head & Bust -->
  <g transform="translate(150, 185)">
    <!-- Head -->
    <circle cx="0" cy="-35" r="46" fill="url(#avatarGrad)" opacity="0.85" />
    <!-- Shoulders / Bust -->
    <path d="M-75 85 C-75 25, -45 5, 0 5 C45 5, 75 25, 75 85 Z" fill="url(#avatarGrad)" opacity="0.85" />
  </g>
  
  <!-- Neutral Badge -->
  <g transform="translate(150, 335)">
    <rect x="-65" y="-14" width="130" height="28" rx="6" fill="#FFFFFF" opacity="0.9" stroke="#CBD5E1" stroke-width="1" />
    <text x="0" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle" letter-spacing="0.5">TENAGA PENDIDIK</text>
  </g>
</svg>

